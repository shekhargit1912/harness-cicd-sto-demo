apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-demo-app
  namespace: harness-demo
  labels:
    app: harness-demo-app
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: harness-demo-app

  template:
    metadata:
      labels:
        app: harness-demo-app

    spec:
      containers:
        - name: harness-demo-app

          # Harness will replace this image during deployment
          image: shekharhub1912/harnessfrontend

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: APP_VERSION
              value: "<+pipeline.sequenceId>"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
