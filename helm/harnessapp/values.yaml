# Default values for the harnessapp chart.

namespace: harness-demo

replicaCount: 2

image:
  repository: shekharhub1912/harnessfrontend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Explicit rolling update strategy per assignment requirement.
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

probes:
  path: /health
  port: 8080
